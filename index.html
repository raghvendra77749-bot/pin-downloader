<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin Saver - High Quality</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 400px; }
        h1 { color: #E60023; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 15px; box-sizing: border-box; background: #333; color: white; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #E60023; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #b8001c; }
        #loader { display: none; margin-top: 15px; border: 4px solid #f3f3f3; border-top: 4px solid #E60023; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-left: auto; margin-right: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #result { margin-top: 20px; }
        .download-btn { background: #008100; text-decoration: none; display: inline-block; margin-top: 10px; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pinterest Save</h1>
        <input type="text" id="pinLink" placeholder="Paste Pinterest link here...">
        <button onclick="getMedia()">Fetch Media</button>
        <div id="loader"></div>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
