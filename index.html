<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Downloader Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111; color: white; text-align: center; padding: 20px; }
        .box { background: #222; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 0 20px rgba(230, 0, 35, 0.2); }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #E60023; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; width: 90%; font-weight: bold; }
        #status { margin-top: 15px; font-size: 14px; }
        .download-link { display: none; margin-top: 20px; background: #28a745; color: white; padding: 10px; text-decoration: none; border-radius: 5px; display: block; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #E60023;">Pin Downloader</h2>
        <input type="text" id="urlInput" placeholder="Paste Pinterest Link Here">
        <button onclick="startDownload()">Download Now</button>
        <div id="status"></div>
        <div id="result"></div>
    </div>

    <script>
        async function startDownload() {
            const url = document.getElementById('urlInput').value;
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            
            if(!url) { alert("Link dalo bhai!"); return; }

            status.innerHTML = "🔄 Processing... Wait 5-10 seconds";
            result.innerHTML = "";

            try {
                // Ye ek open-source serverless function hai jo Pinterest link extract karta hai
                const apiUrl = `https://api.boxentriq.com/social/pinterest-video-downloader?url=${encodeURIComponent(url)}`;
                
                // Hum yahan ek PROXY use kar rahe hain taaki block na ho
                const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(apiUrl);
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const finalData = JSON.parse(data.contents);

                if (finalData && (finalData.url || finalData.video_url)) {
                    const downloadUrl = finalData.video_url || finalData.url;
                    status.innerHTML = "✅ Media Found!";
                    result.innerHTML = `<a href="${downloadUrl}" target="_blank" class="download-link">Click here to Download / Save</a>`;
                } else {
                    status.innerHTML = "❌ Failed. Yeh link support nahi kar raha.";
                }
            } catch (e) {
                status.innerHTML = "⚠️ Server Busy. Try again after 1 minute.";
            }
        }
    </script>
</body>
</html>
